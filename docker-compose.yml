# docker-compose.yml — local convenience only, NOT a production runtime.
#
# `Dockerfile` stays build-only (see README). This file chains that build to a
# stock nginx so you can preview the real static output the same way a host
# would serve it:
#
#   docker compose up --build       # build src/ -> ./dist, serve on :8080
#   docker compose run --rm build   # just refresh ./dist, don't serve
#
# Production is still "drop dist/ onto the static host of your choice".
#
# The inline `configs.content` below needs Compose v2.23+. On older Compose,
# move that block to ./docker/nginx.conf and bind-mount it instead.

name: braindrop-web

services:
  # One-shot: compile the site with the same Node the Dockerfile pins.
  # Exits 0 when dist/ is written; it is a task, not a long-running service.
  build:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "[ -d node_modules/astro ] || npm ci; npm run build"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  # Serve the exported files with the rules from the README's "Serving notes".
  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
    configs:
      - source: nginx_site
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      build:
        condition: service_completed_successfully
    restart: unless-stopped

configs:
  nginx_site:
    content: |
      server {
          listen       80;
          server_name  _;
          root   /usr/share/nginx/html;
          index  index.html;

          # /privacy -> /privacy/ -> /privacy/index.html
          location / {
              try_files $uri $uri/ =404;
          }

          error_page 404 /404.html;

          # hashed assets + fonts never change under a given name
          location ~* ^/(_astro|fonts)/ {
              expires 1y;
              add_header Cache-Control "public, immutable";
          }
      }

volumes:
  node_modules:
