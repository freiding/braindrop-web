# Build the Astro site and serve it on http://localhost:13367
#
#   docker compose up
#
name: braindrop-web

services:
  web:
    image: node:22-alpine
    working_dir: /app
    command: >
      sh -c "[ -d node_modules/astro ] || npm ci;
             npm run build &&
             npm run preview -- --host 0.0.0.0 --port 13367"
    ports:
      - "13369:13367"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
