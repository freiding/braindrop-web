# Build the Astro site and serve it on http://localhost:13367
#
#   docker compose up
#
name: braindrop-web

services:
  web:
    image: node:22-alpine
    working_dir: /app
    # Build the static site, then serve dist/ with busybox httpd (bundled in the
    # alpine image). Unlike `astro preview` it has no host-header allowlist and
    # no PID lockfile in the node_modules volume to get wedged on a recreate.
    command: >
      sh -c "[ -d node_modules/astro ] || npm ci;
             npm run build &&
             exec busybox httpd -f -v -p 13367 -h dist"
    ports:
      - "13369:13367"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
