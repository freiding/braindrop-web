# docker-compose.yml — build, plus an optional local preview.
#
# No web-server image of our own: both services are just the pinned Node
# toolchain from `Dockerfile`. `preview` is `astro preview` over the built
# dist/ (a static file server built into Astro), not nginx.
#
#   docker compose run --rm build   # one-shot: writes ./dist on the host
#   docker compose up preview       # build + serve on http://localhost:13367
#
name: braindrop-web

x-node: &node
  image: node:22-alpine
  working_dir: /app
  volumes:
    - .:/app
    - node_modules:/app/node_modules

services:
  # One-shot: compile src/ -> ./dist, then exit. It is a task, not a service.
  build:
    <<: *node
    command: sh -c "[ -d node_modules/astro ] || npm ci; npm run build"

  # Serve the built dist/ over `astro preview`. Honours trailingSlash + the
  # directory layout, so routes resolve exactly as on a static host.
  preview:
    <<: *node
    command: npm run preview -- --host 0.0.0.0 --port 13367
    ports:
      - "13367:13367"
    depends_on:
      build:
        condition: service_completed_successfully

volumes:
  node_modules:
