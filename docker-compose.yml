# Build the Astro site and serve it on http://localhost:13367
#
#   docker compose up
#
name: braindrop-web

services:
  web:
    image: node:22-alpine
    working_dir: /app
    # Build the static site, then serve dist/ with `serve` (pulled on demand by
    # npx). Unlike `astro preview` it has no host-header allowlist and no PID
    # lockfile in the node_modules volume to get wedged on a recreate; unlike
    # busybox httpd it's actually present in this image.
    command: >
      sh -c "[ -d node_modules/astro ] || npm ci;
             npm run build &&
             exec npx --yes serve dist -l 13367 --no-port-switching --no-clipboard"
    ports:
      - "13369:13367"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
