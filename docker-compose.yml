# docker-compose.yml — build helper, NOT a runtime.
#
# Mirrors `Dockerfile` (build-only): compiles the static site into ./dist with a
# pinned Node toolchain. Nothing is served here — serving is up to the web
# server on the host (see README).
#
#   docker compose run --rm build   # writes ./dist on the host
#
name: braindrop-web

services:
  # One-shot: compile src/ -> ./dist, then exit. It is a task, not a service.
  build:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "[ -d node_modules/astro ] || npm ci; npm run build"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
