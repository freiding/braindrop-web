# Serves the pre-built Astro site.
#
# The build uses `trailingSlash: 'always'` + directory format, so every route
# is <path>/index.html. This block resolves "/privacy" and "/privacy/" to that
# file and sends anything unknown to the generated 404 page.

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Keep redirects relative so the site works unchanged behind another
    # reverse proxy on a different host / port / scheme.
    absolute_redirect off;

    # Resolve <path>/index.html directly (no add-trailing-slash redirect), so
    # the same response works whatever host/port the outer proxy uses.
    location / {
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;

    # Fingerprinted bundles under /_astro/ never change under a given name.
    location /_astro/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    gzip            on;
    gzip_min_length 1024;
    gzip_types      text/css application/javascript application/json image/svg+xml application/xml application/rss+xml;
}
