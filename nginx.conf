server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    server_tokens off;

    # --- Compression ----------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        text/plain
                      text/css
                      application/javascript
                      application/json
                      image/svg+xml
                      application/xml
                      application/rss+xml
                      font/ttf;

    # --- Static assets: hashed build output + self-hosted fonts --------
    # Stable under a given name -> cache hard.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- HTML: revalidate every time, plus baseline security headers ---
    # (nginx add_header does not inherit into a location that sets its
    #  own, so the headers are declared here where they matter.)
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # --- Routing ------------------------------------------------------
    # Build uses trailingSlash: 'always' + directory format, so every route
    # is <path>/index.html. `$uri/` lets nginx 301 /privacy -> /privacy/
    # and serve its index.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
